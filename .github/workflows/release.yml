name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/upload (e.g. v0.4.22). Empty = build only artifacts."
        required: false
        default: ""

permissions:
  contents: write

env:
  CMAKE_BUILD_TYPE: Release
  ZLIB_VERSION: "1.3.1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux native ---
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact: mpmpes-linux-x86_64
            cross: none

          - name: linux-x86_64-static
            os: ubuntu-22.04
            artifact: mpmpes-linux-x86_64-static
            cross: static

          - name: linux-aarch64
            os: ubuntu-22.04-arm
            artifact: mpmpes-linux-aarch64
            cross: none

          # --- Linux cross (compiler + vendored zlib; no multiarch apt) ---
          - name: linux-armv7
            os: ubuntu-22.04
            artifact: mpmpes-linux-armv7
            cross: armv7
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++
            strip: arm-linux-gnueabihf-strip
            host: arm-linux-gnueabihf
            packages: g++-arm-linux-gnueabihf gcc-arm-linux-gnueabihf
            system_processor: arm
            ldflags: ""

          - name: linux-s390x
            os: ubuntu-22.04
            artifact: mpmpes-linux-s390x
            cross: s390x
            cc: s390x-linux-gnu-gcc
            cxx: s390x-linux-gnu-g++
            strip: s390x-linux-gnu-strip
            host: s390x-linux-gnu
            packages: g++-s390x-linux-gnu gcc-s390x-linux-gnu
            system_processor: s390x
            ldflags: ""

          - name: linux-ppc64le
            os: ubuntu-22.04
            artifact: mpmpes-linux-ppc64le
            cross: ppc64le
            cc: powerpc64le-linux-gnu-gcc
            cxx: powerpc64le-linux-gnu-g++
            strip: powerpc64le-linux-gnu-strip
            host: powerpc64le-linux-gnu
            packages: g++-powerpc64le-linux-gnu gcc-powerpc64le-linux-gnu
            system_processor: ppc64le
            ldflags: ""

          - name: linux-riscv64
            os: ubuntu-22.04
            artifact: mpmpes-linux-riscv64
            cross: riscv64
            cc: riscv64-linux-gnu-gcc
            cxx: riscv64-linux-gnu-g++
            strip: riscv64-linux-gnu-strip
            host: riscv64-linux-gnu
            packages: g++-riscv64-linux-gnu gcc-riscv64-linux-gnu
            system_processor: riscv64
            # atomics handled in CMakeLists (target_link_libraries atomic)
            ldflags: ""

          # Windows (MSVC) needs Winsock/dlfcn port — not yet supported.
          # Use WSL / Linux binary on Windows for now.

          # --- macOS ---
          - name: macos-x86_64
            os: macos-13
            artifact: mpmpes-macos-x86_64
            cross: none

          - name: macos-arm64
            os: macos-14
            artifact: mpmpes-macos-arm64
            cross: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (Ubuntu native dynamic)
        if: runner.os == 'Linux' && matrix.cross == 'none'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config zlib1g-dev file

      - name: Build static zlib + static link flags
        if: runner.os == 'Linux' && matrix.cross == 'static'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file
          PREFIX="${GITHUB_WORKSPACE}/.deps/x86_64-static"
          mkdir -p "$PREFIX" third_party
          curl -fsSL "https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz" \
            -o third_party/zlib.tar.gz
          tar -xzf third_party/zlib.tar.gz -C third_party
          (
            cd "third_party/zlib-${ZLIB_VERSION}"
            ./configure --static --prefix="$PREFIX"
            make -j"$(nproc)"
            make install
          )
          {
            echo "CMAKE_EXTRA=-DZLIB_ROOT=${PREFIX} -DZLIB_INCLUDE_DIR=${PREFIX}/include -DZLIB_LIBRARY=${PREFIX}/lib/libz.a -DCMAKE_EXE_LINKER_FLAGS=-static"
          } >> "$GITHUB_ENV"

      - name: Install cross compiler + build target zlib
        if: runner.os == 'Linux' && matrix.cross != 'none' && matrix.cross != 'static'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file \
            ${{ matrix.packages }}
          PREFIX="${GITHUB_WORKSPACE}/.deps/${{ matrix.cross }}"
          mkdir -p "$PREFIX" third_party
          curl -fsSL "https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz" \
            -o third_party/zlib.tar.gz
          tar -xzf third_party/zlib.tar.gz -C third_party
          (
            cd "third_party/zlib-${ZLIB_VERSION}"
            CHOST="${{ matrix.host }}" CC="${{ matrix.cc }}" \
              AR="${{ matrix.host }}-ar" RANLIB="${{ matrix.host }}-ranlib" \
              ./configure --static --prefix="$PREFIX"
            make -j"$(nproc)"
            make install
          )
          LDFLAGS="${{ matrix.ldflags }}"
          CMAKE_EXTRA="-DCMAKE_SYSTEM_NAME=Linux"
          CMAKE_EXTRA+=" -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.system_processor }}"
          CMAKE_EXTRA+=" -DCMAKE_C_COMPILER=${{ matrix.cc }}"
          CMAKE_EXTRA+=" -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}"
          CMAKE_EXTRA+=" -DZLIB_ROOT=${PREFIX}"
          CMAKE_EXTRA+=" -DZLIB_INCLUDE_DIR=${PREFIX}/include"
          CMAKE_EXTRA+=" -DZLIB_LIBRARY=${PREFIX}/lib/libz.a"
          if [ -n "${LDFLAGS}" ]; then
            CMAKE_EXTRA+=" -DCMAKE_EXE_LINKER_FLAGS=${LDFLAGS}"
          fi
          echo "CMAKE_EXTRA=${CMAKE_EXTRA}" >> "$GITHUB_ENV"
          echo "STRIP_BIN=${{ matrix.strip }}" >> "$GITHUB_ENV"

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja || true

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DMPMPES_BUILD_EXAMPLE_NATIVE=OFF \
            ${CMAKE_EXTRA:-}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          file build/mpmpes || true
          ls -la build/mpmpes

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ART="${{ matrix.artifact }}"
          hash_files() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$@"
            else
              shasum -a 256 "$@"
            fi
          }
          cp build/mpmpes "dist/${ART}"
          chmod +x "dist/${ART}"
          STRIP_BIN="${STRIP_BIN:-strip}"
          if command -v "$STRIP_BIN" >/dev/null 2>&1; then
            "$STRIP_BIN" "dist/${ART}" || true
          fi
          tar -C dist -czf "dist/${ART}.tar.gz" "${ART}"
          (cd dist && hash_files "${ART}" "${ART}.tar.gz" > "${ART}.sha256")
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    # Publish even if some matrix cells failed
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [ ! -d artifacts ]; then
            echo "No artifacts — all builds failed?"
            exit 1
          fi
          find artifacts -type f -print
          while IFS= read -r f; do
            cp -v "$f" release-assets/
          done < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \))
          count=$(find release-assets -type f | wc -l)
          echo "asset files: $count"
          [ "$count" -gt 0 ] || { echo "no release assets"; exit 1; }
          (cd release-assets && sha256sum * > SHA256SUMS.txt || true)
          ls -la release-assets/
          cat release-assets/SHA256SUMS.txt || true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: MPMPESCoreCpp ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, 'rc') || contains(steps.tag.outputs.name, 'beta') || contains(steps.tag.outputs.name, 'alpha') }}
          generate_release_notes: true
          body: |
            ## MPMPESCoreCpp ${{ steps.tag.outputs.name }}

            Minecraft: PE **0.14.x** (protocol 70) C++ server core.

            Multi-arch binaries from GitHub Actions. Checksums in `SHA256SUMS.txt`.

            | Asset | Platform |
            |-------|----------|
            | `mpmpes-linux-x86_64.tar.gz` | Linux x86_64 (glibc) |
            | `mpmpes-linux-x86_64-static.tar.gz` | Linux x86_64 fully static |
            | `mpmpes-linux-aarch64.tar.gz` | Linux ARM64 |
            | `mpmpes-linux-armv7.tar.gz` | Linux ARMv7 hard-float |
            | `mpmpes-linux-s390x.tar.gz` | Linux IBM Z (s390x) |
            | `mpmpes-linux-ppc64le.tar.gz` | Linux POWER little-endian |
            | `mpmpes-linux-riscv64.tar.gz` | Linux RISC-V 64 |
            | `mpmpes-macos-x86_64.tar.gz` | macOS Intel |
            | `mpmpes-macos-arm64.tar.gz` | macOS Apple Silicon |

            > **Windows:** not built yet (POSIX sockets / dlfcn). Use WSL or a Linux binary.

            ```bash
            tar -xzf mpmpes-linux-x86_64.tar.gz
            chmod +x mpmpes-linux-x86_64
            ./mpmpes-linux-x86_64 --port 19132
            ```

            First run creates `server.properties` if missing.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
