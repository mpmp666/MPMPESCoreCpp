name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/upload (e.g. v0.4.22). Empty = build only artifacts."
        required: false
        default: ""

permissions:
  contents: write

env:
  CMAKE_BUILD_TYPE: Release
  ZLIB_VERSION: "1.3.1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux native ---
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact: mpmpes-linux-x86_64
            cmake_args: ""
            cross: none

          - name: linux-x86_64-static
            os: ubuntu-22.04
            artifact: mpmpes-linux-x86_64-static
            cmake_args: "-DCMAKE_EXE_LINKER_FLAGS=-static"
            cross: static-try

          - name: linux-aarch64
            os: ubuntu-22.04-arm
            artifact: mpmpes-linux-aarch64
            cmake_args: ""
            cross: none

          # --- Linux cross (compiler only + vendored zlib; no multiarch apt) ---
          - name: linux-armv7
            os: ubuntu-22.04
            artifact: mpmpes-linux-armv7
            cmake_args: ""
            cross: armv7
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++
            strip: arm-linux-gnueabihf-strip
            host: arm-linux-gnueabihf
            packages: g++-arm-linux-gnueabihf gcc-arm-linux-gnueabihf
            system_processor: arm

          - name: linux-s390x
            os: ubuntu-22.04
            artifact: mpmpes-linux-s390x
            cmake_args: ""
            cross: s390x
            cc: s390x-linux-gnu-gcc
            cxx: s390x-linux-gnu-g++
            strip: s390x-linux-gnu-strip
            host: s390x-linux-gnu
            packages: g++-s390x-linux-gnu gcc-s390x-linux-gnu
            system_processor: s390x

          - name: linux-ppc64le
            os: ubuntu-22.04
            artifact: mpmpes-linux-ppc64le
            cmake_args: ""
            cross: ppc64le
            cc: powerpc64le-linux-gnu-gcc
            cxx: powerpc64le-linux-gnu-g++
            strip: powerpc64le-linux-gnu-strip
            host: powerpc64le-linux-gnu
            packages: g++-powerpc64le-linux-gnu gcc-powerpc64le-linux-gnu
            system_processor: ppc64le

          - name: linux-riscv64
            os: ubuntu-22.04
            artifact: mpmpes-linux-riscv64
            cmake_args: ""
            cross: riscv64
            cc: riscv64-linux-gnu-gcc
            cxx: riscv64-linux-gnu-g++
            strip: riscv64-linux-gnu-strip
            host: riscv64-linux-gnu
            packages: g++-riscv64-linux-gnu gcc-riscv64-linux-gnu
            system_processor: riscv64

          # --- Windows ---
          - name: windows-x86_64
            os: windows-2022
            artifact: mpmpes-windows-x86_64
            cmake_args: ""
            cross: none

          # --- macOS ---
          - name: macos-x86_64
            os: macos-13
            artifact: mpmpes-macos-x86_64
            cmake_args: ""
            cross: none

          - name: macos-arm64
            os: macos-14
            artifact: mpmpes-macos-arm64
            cmake_args: ""
            cross: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (Ubuntu native)
        if: runner.os == 'Linux' && (matrix.cross == 'none' || matrix.cross == 'static-try')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config zlib1g-dev zlib1g-dev \
            file
          # static link needs static libz
          if [ "${{ matrix.cross }}" = "static-try" ]; then
            sudo apt-get install -y --no-install-recommends zlib1g-dev
          fi

      - name: Install cross compiler + build target zlib
        if: runner.os == 'Linux' && matrix.cross != 'none' && matrix.cross != 'static-try'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file \
            ${{ matrix.packages }}
          # Build zlib for target (avoid multiarch apt / ports.ubuntu.com mess)
          PREFIX="${GITHUB_WORKSPACE}/.deps/${{ matrix.cross }}"
          mkdir -p "$PREFIX" third_party
          curl -fsSL "https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz" \
            -o third_party/zlib.tar.gz
          tar -xzf third_party/zlib.tar.gz -C third_party
          cd "third_party/zlib-${ZLIB_VERSION}"
          CHOST="${{ matrix.host }}" CC="${{ matrix.cc }}" AR="${{ matrix.host }}-ar" RANLIB="${{ matrix.host }}-ranlib" \
            ./configure --static --prefix="$PREFIX"
          make -j"$(nproc)"
          make install
          echo "ZLIB_ROOT=${PREFIX}" >> "$GITHUB_ENV"
          echo "CMAKE_EXTRA=-DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.system_processor }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DZLIB_ROOT=${PREFIX} -DZLIB_INCLUDE_DIR=${PREFIX}/include -DZLIB_LIBRARY=${PREFIX}/lib/libz.a" >> "$GITHUB_ENV"
          echo "STRIP_BIN=${{ matrix.strip }}" >> "$GITHUB_ENV"

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja || true

      - name: Build zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:ZLIB_VERSION
          $prefix = Join-Path $env:GITHUB_WORKSPACE ".deps\zlib-win"
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          $url = "https://github.com/madler/zlib/releases/download/v$ver/zlib-$ver.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile third_party\zlib.tar.gz
          tar -xzf third_party\zlib.tar.gz -C third_party
          cmake -S "third_party/zlib-$ver" -B third_party/zlib-build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$prefix" `
            -DZLIB_BUILD_EXAMPLES=OFF
          cmake --build third_party/zlib-build --config Release --target install -j $env:NUMBER_OF_PROCESSORS
          # MSVC install layout: lib/zlib.lib or zlibstatic.lib
          Get-ChildItem -Recurse $prefix | Select-Object FullName
          "ZLIB_ROOT=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          EXTRA="${CMAKE_EXTRA:-} ${{ matrix.cmake_args }}"
          # shell word-splitting intentional for cmake args
          # shellcheck disable=SC2086
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DMPMPES_BUILD_EXAMPLE_NATIVE=OFF \
            ${EXTRA}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          file build/mpmpes || true
          ls -la build/mpmpes

      - name: Configure & Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $z = $env:ZLIB_ROOT
          $lib = @(
            Join-Path $z "lib\zlibstatic.lib"
            Join-Path $z "lib\zlib.lib"
            Join-Path $z "lib\z.lib"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $lib) { throw "zlib library not found under $z" }
          $inc = Join-Path $z "include"
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DMPMPES_BUILD_EXAMPLE_NATIVE=OFF `
            -DZLIB_ROOT="$z" `
            -DZLIB_INCLUDE_DIR="$inc" `
            -DZLIB_LIBRARY="$lib"
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
          Get-ChildItem -Recurse build -Filter mpmpes.exe | Select-Object FullName,Length

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ART="${{ matrix.artifact }}"
          hash_files() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$@"
            else
              shasum -a 256 "$@"
            fi
          }
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=$(find build -name 'mpmpes.exe' | head -n1)
            cp "$BIN" "dist/${ART}.exe"
            (
              cd dist
              if command -v 7z >/dev/null 2>&1; then
                7z a -tzip "${ART}.zip" "${ART}.exe" >/dev/null
              else
                powershell -NoProfile -Command "Compress-Archive -Path '${ART}.exe' -DestinationPath '${ART}.zip' -Force"
              fi
              hash_files "${ART}.exe" "${ART}.zip" > "${ART}.sha256"
            )
          else
            cp build/mpmpes "dist/${ART}"
            chmod +x "dist/${ART}"
            STRIP_BIN="${STRIP_BIN:-strip}"
            if command -v "$STRIP_BIN" >/dev/null 2>&1; then
              "$STRIP_BIN" "dist/${ART}" || true
            fi
            tar -C dist -czf "dist/${ART}.tar.gz" "${ART}"
            (cd dist && hash_files "${ART}" "${ART}.tar.gz" > "${ART}.sha256")
          fi
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    # Publish even if some matrix cells failed (partial multi-arch release)
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [ ! -d artifacts ]; then
            echo "No artifacts directory — all builds failed?"
            exit 1
          fi
          find artifacts -type f -print
          while IFS= read -r f; do
            cp -v "$f" release-assets/
          done < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \))
          count=$(find release-assets -type f | wc -l)
          echo "asset files: $count"
          [ "$count" -gt 0 ] || { echo "no release assets"; exit 1; }
          (cd release-assets && sha256sum * > SHA256SUMS.txt || true)
          ls -la release-assets/
          cat release-assets/SHA256SUMS.txt || true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: MPMPESCoreCpp ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, 'rc') || contains(steps.tag.outputs.name, 'beta') || contains(steps.tag.outputs.name, 'alpha') }}
          generate_release_notes: true
          body: |
            ## MPMPESCoreCpp ${{ steps.tag.outputs.name }}

            Minecraft: PE **0.14.x** (protocol 70) C++ server core.

            Multi-arch binaries built by GitHub Actions. See assets below / `SHA256SUMS.txt`.

            ### Common assets
            | Asset | Platform |
            |-------|----------|
            | `mpmpes-linux-x86_64.tar.gz` | Linux x86_64 |
            | `mpmpes-linux-x86_64-static.tar.gz` | Linux x86_64 static (if linked) |
            | `mpmpes-linux-aarch64.tar.gz` | Linux ARM64 |
            | `mpmpes-linux-armv7.tar.gz` | Linux ARMv7 hf |
            | `mpmpes-linux-s390x.tar.gz` | Linux IBM Z (s390x) |
            | `mpmpes-linux-ppc64le.tar.gz` | Linux POWER LE |
            | `mpmpes-linux-riscv64.tar.gz` | Linux RISC-V 64 |
            | `mpmpes-windows-x86_64.zip` | Windows x64 |
            | `mpmpes-macos-x86_64.tar.gz` | macOS Intel |
            | `mpmpes-macos-arm64.tar.gz` | macOS Apple Silicon |

            ```bash
            tar -xzf mpmpes-linux-x86_64.tar.gz
            chmod +x mpmpes-linux-x86_64
            ./mpmpes-linux-x86_64 --port 19132
            ```
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
